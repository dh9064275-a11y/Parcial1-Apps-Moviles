
name: Pruebas automatizadas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testing:
    name: Tests en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
	
	      - name: Cachear paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restaurar dependencias
        run: dotnet restore ProyectoParcial1.Tests/ProyectoParcial1.Tests.csproj

      - name: Compilar proyecto de pruebas
        run: dotnet build ProyectoParcial1.Tests/ProyectoParcial1.Tests.csproj --no-restore --configuration Release

      - name: Ejecutar pruebas xUnit
        run: dotnet test ProyectoParcial1.Tests/ProyectoParcial1.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=resultados.trx" --results-directory TestResults

      - name: Guardar resultados como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn
